name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  THEOS: ${{ github.workspace }}/.theos-root
  THEOS_PACKAGE_SCHEME: ""

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Theos 本体做缓存，命中后可以省掉一两分钟的 clone
      - name: 缓存 Theos
        uses: actions/cache@v4
        with:
          path: ${{ env.THEOS }}
          key: theos-${{ runner.os }}-${{ hashFiles('.github/workflows/build.yml') }}

      - name: 安装 Theos
        run: |
          set -e
          echo "$THEOS/bin" >> "$GITHUB_PATH"

          if [ -f "$THEOS/makefiles/common.mk" ]; then
            echo "Theos 已缓存"
          else
            rm -rf "$THEOS"
            git clone --depth 1 --recursive https://github.com/theos/theos.git "$THEOS"
          fi

          if ! ls -d "$THEOS"/sdks/iPhoneOS*.sdk >/dev/null 2>&1; then
            # 只拉一个 SDK：版本号最大的那个
            git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git "$RUNNER_TEMP/sdks"
            cd "$RUNNER_TEMP/sdks"
            SDK="$(git ls-tree --name-only HEAD \
                    | grep -E '^iPhoneOS[0-9]+\.[0-9]+\.sdk$' \
                    | sed 's/^iPhoneOS//; s/\.sdk$//' \
                    | awk -F. '{printf "%03d%03d %s\n", $1, $2, $0}' \
                    | sort -n | tail -1 | awk '{print $2}')"
            echo "使用 SDK: iPhoneOS$SDK.sdk"
            git sparse-checkout set "iPhoneOS$SDK.sdk"
            mkdir -p "$THEOS/sdks"
            rm -rf "$THEOS/sdks/iPhoneOS$SDK.sdk"
            cp -R "iPhoneOS$SDK.sdk" "$THEOS/sdks/"
          fi

          chmod +x "$THEOS"/bin/* 2>/dev/null || true
          if [ ! -x "$THEOS/bin/ldid" ] && ! command -v ldid >/dev/null 2>&1; then
            brew install ldid || true
          fi
          echo "THEOS=$THEOS"
          ls "$THEOS/sdks"

      - name: 编译
        run: |
          set -o pipefail
          make clean || true
          make package FINALPACKAGE=1 DEBUG=0 2>&1 | tee build.log

      - name: 收集产物
        run: |
          mkdir -p out
          cp -v packages/*.deb out/ 2>/dev/null || true
          find .theos -name '*.dylib' -exec cp -v {} out/ \;
          cd out && zip -j ITHomeEnhance-dylib.zip *.dylib
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ITHomeEnhance
          path: out/*
          if-no-files-found: error

      - name: 编译失败时上传日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
